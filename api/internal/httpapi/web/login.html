<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in — DevSwell</title>
<link rel="icon" type="image/png" href="/static/logo-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    document.documentElement.setAttribute('data-theme', saved === 'light' ? 'light' : 'dark');
  })();
</script>
<style>
  :root[data-theme="dark"] {
    --bg: #0a0a0a; --bg-elevated: #111111; --bg-card: #0e0e0e;
    --text: #f2f2f2; --text-muted: #8a8a8a; --border: #1f1f1f; --border-hover: #2e2e2e;
    --accent: #2b9fe0; --accent-text: #ffffff; --accent-subtle: rgba(43, 159, 224, 0.12);
    --danger: #e5534b; --danger-subtle: rgba(229, 83, 75, 0.12);
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --bg-elevated: #fafafa; --bg-card: #ffffff;
    --text: #171717; --text-muted: #6b6b6b; --border: #e5e5e5; --border-hover: #d4d4d4;
    --accent: #0b7bb8; --accent-text: #ffffff; --accent-subtle: rgba(11, 123, 184, 0.08);
    --danger: #cf222e; --danger-subtle: rgba(207, 34, 46, 0.08);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 24px; text-decoration: none; color: var(--text); }
  .brand img { height: 28px; }
  .brand span { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }

  .panel {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 28px;
    width: 100%;
    max-width: 360px;
  }
  .panel h1 { font-size: 17px; margin: 0 0 4px; font-weight: 600; }
  .panel .sub { color: var(--text-muted); font-size: 13px; margin: 0 0 22px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 8px 10px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-elevated); color: var(--text); font: inherit; font-size: 13px;
  }
  .field input:focus { outline: none; border-color: var(--accent); }

  button {
    font: inherit; font-size: 13px; cursor: pointer; border-radius: 6px; border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-text); font-weight: 500; padding: 9px; width: 100%; margin-top: 4px;
  }
  button:hover { filter: brightness(1.1); }

  .form-message { margin-top: 12px; font-size: 12px; padding: 8px 10px; border-radius: 6px; display: none; }
  .form-message.success { display: block; background: var(--accent-subtle); color: var(--accent); }
  .form-message.error { display: block; background: var(--danger-subtle); color: var(--danger); }

  .switch-link { text-align: center; margin-top: 18px; font-size: 13px; color: var(--text-muted); }
  .switch-link a { color: var(--accent); text-decoration: none; }
  .switch-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<a class="brand" href="/">
  <img src="/static/logo-mark.png" alt="DevSwell">
  <span>DevSwell</span>
</a>

<div class="panel">
  <h1>Welcome back</h1>
  <p class="sub">Log in to see your digest.</p>

  <form id="loginForm" onsubmit="return handleLogin(event)">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="email">
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <button type="submit">Log in</button>
    <div class="form-message" id="message"></div>
  </form>

  <div class="switch-link">Don't have an account? <a href="/signup">Sign up</a></div>
</div>

<script>
  async function handleLogin(e) {
    e.preventDefault();
    var email = document.getElementById('email').value;
    var password = document.getElementById('password').value;
    var msg = document.getElementById('message');

    try {
      var res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password })
      });
      if (res.ok) {
        window.location.href = '/dashboard';
      } else {
        msg.textContent = await res.text();
        msg.className = 'form-message error';
      }
    } catch (err) {
      msg.textContent = 'Something went wrong. Please try again.';
      msg.className = 'form-message error';
    }
    return false;
  }
</script>

</body>
</html>
